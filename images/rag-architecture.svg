<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f9f9f9" rx="10" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Enterprise RAG & OCR Architecture</text>

  <!-- Input Layer -->
  <g transform="translate(50, 80)">
    <rect width="160" height="60" rx="8" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Raw Documents</text>
    <text x="80" y="52" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">(PDF, Scans, Forms)</text>
  </g>

  <!-- OCR Engine -->
  <g transform="translate(280, 80)">
    <rect width="160" height="60" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">High-Speed OCR</text>
    <text x="80" y="52" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">(Qwen3.6 MoE + llama.cpp)</text>
  </g>

  <!-- Validation -->
  <g transform="translate(510, 80)">
    <rect width="160" height="60" rx="8" fill="#fce4ec" stroke="#e91e63" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Human-in-the-Loop</text>
    <text x="80" y="52" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">(Token Analytics & QA)</text>
  </g>

  <!-- Embedding -->
  <g transform="translate(280, 200)">
    <rect width="160" height="60" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Vectorization</text>
    <text x="80" y="52" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">(infinity-emb Server)</text>
  </g>

  <!-- Database -->
  <g transform="translate(280, 320)">
    <path d="M0,15 C0,5 160,5 160,15 L160,50 C160,60 0,60 0,50 Z" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" filter="url(#shadow)"/>
    <ellipse cx="80" cy="15" rx="80" ry="10" fill="#e1bee7" stroke="#9c27b0" stroke-width="2"/>
    <text x="80" y="40" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Elasticsearch Index</text>
  </g>

  <!-- Router / LLM -->
  <g transform="translate(510, 260)">
    <polygon points="80,0 160,50 80,100 0,50" fill="#fff8e1" stroke="#ffc107" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="45" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">Intent Router</text>
    <text x="80" y="65" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">(Local vs Cloud)</text>
  </g>

  <!-- Output -->
  <g transform="translate(510, 420)">
    <rect width="160" height="60" rx="30" fill="#263238" stroke="#000" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#fff">Final Response</text>
  </g>

  <!-- Arrows -->
  <line x1="210" y1="110" x2="280" y2="110" stroke="#444" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="110" x2="510" y2="110" stroke="#444" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <line x1="360" y1="140" x2="360" y2="200" stroke="#444" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="360" y1="260" x2="360" y2="320" stroke="#444" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <line x1="440" y1="350" x2="510" y2="310" stroke="#444" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="590" y1="360" x2="590" y2="420" stroke="#444" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Feedback Loop Arrow -->
  <path d="M 590 450 L 590 480 L 130 480 L 130 140" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="350" y="475" font-family="Arial" font-size="10" fill="#777">User Feedback / Deep Search Fallback</text>

</svg>